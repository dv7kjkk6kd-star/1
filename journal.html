<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deník obchodů</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--ink:#14202B;--muted:#5B6B79;--rule:#D3DCE3;--up:#0B7A6B;--down:#B3303C;--field:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A22;--ink:#E6EDF2;--muted:#93A4B2;--rule:#243442;--up:#3CC4AE;--down:#F0707B;--field:#16242E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:32px 20px 64px}
nav{display:flex;gap:20px;margin-bottom:40px}nav a{color:var(--muted);text-decoration:none;padding:4px 0}
nav a[aria-current]{color:var(--ink);border-bottom:2px solid var(--ink)}
h2{font-size:18px;font-weight:600;margin:0 0 12px}
section{margin-bottom:44px}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px;margin-bottom:16px}
.stat b{display:block;font:400 34px/1.1 "Newsreader",Georgia,serif}.stat span{color:var(--muted);font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--muted)}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;background:var(--field);border:1px solid var(--rule);border-radius:6px}
button{padding:9px 16px;background:var(--ink);color:var(--bg);border:0;border-radius:6px;cursor:pointer;font-weight:500}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.out{margin-top:12px;color:var(--muted)}.out b{color:var(--ink)}
.trade{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 0;border-bottom:1px solid var(--rule)}
.trade p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
.trade img{max-width:100%;max-height:260px;margin-top:10px;border-radius:6px;cursor:zoom-in}
.r{font:400 28px/1 "Newsreader",Georgia,serif;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
svg.curve{width:100%;height:90px;color:var(--ink)}
.empty{color:var(--muted)}
</style></head>
<body><main>
<nav><a href="index.html">Ranní briefing</a><a href="journal.html" aria-current="page">Deník obchodů</a></nav>

<section><h2>Výsledky</h2><div class="stats" id="stats"></div><div id="curve"></div></section>

<section><h2>Kalkulačka velikosti pozice</h2>
<div class="grid">
<label>Účet<input id="c-acc" type="number" step="any" value="10000"></label>
<label>Riziko na obchod (%)<input id="c-risk" type="number" step="any" value="1"></label>
<label>Vstup<input id="c-entry" type="number" step="any"></label>
<label>Stop<input id="c-stop" type="number" step="any"></label>
<label>Hodnota bodu na kontrakt<input id="c-pv" type="number" step="any" value="1"></label>
</div><p class="out" id="c-out">Vyplň vstup a stop.</p></section>

<section><h2>Nový obchod</h2>
<form id="f"><div class="grid">
<label>Datum<input name="date" type="date" required></label>
<label>Instrument<input name="inst" value="NQ" required></label>
<label>Směr<select name="dir"><option value="long">Long</option><option value="short">Short</option></select></label>
<label>Vstup<input name="entry" type="number" step="any" required></label>
<label>Stop<input name="stop" type="number" step="any" required></label>
<label>Cíl<input name="target" type="number" step="any" required></label>
<label>Výstup (až po uzavření)<input name="exit" type="number" step="any"></label>
<label>Velikost (kontrakty/akcie)<input name="size" type="number" step="any"></label>
</div>
<label style="margin-top:12px">Poznámky: setup, emoce, co jsem se naučil<textarea name="notes" rows="3"></textarea></label>
<label style="margin-top:12px">Screenshot z grafu (vyber soubor nebo ho vlož přes Ctrl+V)<input name="shot" type="file" accept="image/*"></label>
<p class="out" id="shotinfo"></p>
<div class="row"><button type="submit">Uložit obchod</button></div>
</form></section>

<section><h2>Obchody</h2><div id="list"></div>
<div class="row"><button class="ghost" id="exp" type="button">Zálohovat do souboru</button>
<button class="ghost" id="imp" type="button">Obnovit ze zálohy</button><input id="impf" type="file" accept="application/json" hidden></div>
<p class="out">Obchody se ukládají jen v tomto prohlížeči na tomto zařízení. Zálohuj je pravidelně.</p></section>
</main>
<script>
const S = "trades";
let db, pending = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (x, d = 2) => x.toLocaleString("cs-CZ", {maximumFractionDigits: d});
const sg = x => (x >= 0 ? "+" : "\u2212") + fmt(Math.abs(x));

function open() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("journal", 1);
    r.onupgradeneeded = () => r.result.createObjectStore(S, {keyPath: "id", autoIncrement: true});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(S, mode), o = fn(t.objectStore(S));
    t.oncomplete = () => res(o && o.result); t.onerror = () => rej(t.error);
  });
}
const all = () => tx("readonly", s => s.getAll());

const dir = t => t.dir === "short" ? -1 : 1;
const risk = t => Math.abs(t.entry - t.stop);
const plan = t => risk(t) ? Math.abs(t.target - t.entry) / risk(t) : null;
const real = t => (t.exit != null && risk(t)) ? (t.exit - t.entry) * dir(t) / risk(t) : null;

function stats(trades) {
  const done = trades.filter(t => real(t) !== null).sort((a, b) => a.date.localeCompare(b.date));
  const rs = done.map(real), total = rs.reduce((a, b) => a + b, 0);
  const wins = rs.filter(r => r > 0).length;
  const plans = trades.map(plan).filter(p => p !== null);
  const items = [
    ["Uzavřené obchody", done.length],
    ["Úspěšnost", done.length ? fmt(wins / done.length * 100, 0) + "\u00a0%" : "–"],
    ["Průměr na obchod", done.length ? `<span class="${total >= 0 ? "up" : "down"}">${sg(total / done.length)}\u00a0R</span>` : "–"],
    ["Celkem", done.length ? `<span class="${total >= 0 ? "up" : "down"}">${sg(total)}\u00a0R</span>` : "–"],
    ["Plánovaný R:R v průměru", plans.length ? "1:" + fmt(plans.reduce((a, b) => a + b, 0) / plans.length) : "–"],
  ];
  $("stats").innerHTML = items.map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  if (rs.length < 2) { $("curve").innerHTML = ""; return; }
  let c = 0; const pts = [0, ...rs.map(r => (c += r))];
  const lo = Math.min(...pts), hi = Math.max(...pts), rng = (hi - lo) || 1;
  const p = pts.map((v, i) => `${(i / (pts.length - 1) * 400).toFixed(1)},${(56 - (v - lo) / rng * 52).toFixed(1)}`).join(" ");
  $("curve").innerHTML = `<svg class="curve" viewBox="0 0 400 60" preserveAspectRatio="none" role="img" aria-label="Vývoj výsledku v R"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

async function render() {
  const trades = await all();
  stats(trades);
  trades.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $("list").innerHTML = trades.length ? "" : '<p class="empty">Zatím žádný obchod. Přidej první formulářem výše.</p>';
  trades.forEach(t => {
    const r = real(t), p = plan(t), el = document.createElement("div");
    el.className = "trade";
    el.innerHTML = `<div><b>${esc(t.inst)} ${t.dir === "short" ? "short" : "long"}</b> <span class="empty">${esc(t.date)}</span>
      <p>Vstup ${fmt(t.entry)}, stop ${fmt(t.stop)}, cíl ${fmt(t.target)}${t.exit != null ? ", výstup " + fmt(t.exit) : ", otevřený"}${p ? ", plán 1:" + fmt(p) : ""}${t.size ? ", velikost " + fmt(t.size) : ""}</p>
      ${t.notes ? `<p>${esc(t.notes)}</p>` : ""}</div>
      <div><div class="r ${r === null ? "" : r >= 0 ? "up" : "down"}">${r === null ? "–" : sg(r) + "\u00a0R"}</div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" data-id="${t.id}">Smazat</button></div></div>`;
    if (t.shot) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(t.shot); img.alt = "Screenshot obchodu";
      img.onclick = () => window.open(img.src);
      el.firstElementChild.appendChild(img);
    }
    el.querySelector("button").onclick = async () => { if (confirm("Smazat tento obchod?")) { await tx("readwrite", s => s.delete(t.id)); render(); } };
    $("list").appendChild(el);
  });
}

function calc() {
  const g = id => parseFloat($(id).value), acc = g("c-acc"), rp = g("c-risk"), e = g("c-entry"), s = g("c-stop"), pv = g("c-pv");
  if ([acc, rp, e, s, pv].some(isNaN) || e === s) { $("c-out").textContent = "Vyplň vstup a stop."; return; }
  const money = acc * rp / 100, perUnit = Math.abs(e - s) * pv, size = money / perUnit;
  $("c-out").innerHTML = `Riskuješ <b>${fmt(money)}</b>. Velikost pozice: <b>${fmt(size)}</b> (zaokrouhli dolů na ${fmt(Math.floor(size), 0)}). Cíl pro R:R 1:2 je <b>${fmt(e + (e - s) * 2)}</b>, pro 1:3 <b>${fmt(e + (e - s) * 3)}</b>.`;
}
document.querySelectorAll("[id^=c-]").forEach(i => i.addEventListener("input", calc));

$("f").elements.date.valueAsDate = new Date();
$("f").elements.shot.onchange = e => { pending = e.target.files[0] || null; $("shotinfo").textContent = pending ? "Screenshot připraven." : ""; };
document.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f) { pending = f; $("shotinfo").textContent = "Screenshot vložen ze schránky."; }
});
$("f").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), n = k => d[k] === "" ? null : parseFloat(d[k]);
  await tx("readwrite", s => s.add({date: d.date, inst: d.inst, dir: d.dir, entry: n("entry"), stop: n("stop"), target: n("target"),
    exit: n("exit"), size: n("size"), notes: d.notes, shot: pending}));
  e.target.reset(); e.target.elements.date.valueAsDate = new Date(); pending = null; $("shotinfo").textContent = "";
  render();
};

const toUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$("exp").onclick = async () => {
  const trades = await all();
  for (const t of trades) if (t.shot) t.shot = await toUrl(t.shot);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(trades)], {type: "application/json"}));
  a.download = "zaloha-denik-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
};
$("imp").onclick = () => $("impf").click();
$("impf").onchange = async e => {
  try {
    const trades = JSON.parse(await e.target.files[0].text());
    for (const t of trades) { if (t.shot) t.shot = await (await fetch(t.shot)).blob(); delete t.id; await tx("readwrite", s => s.add(t)); }
    render();
  } catch { alert("Soubor se nepodařilo načíst. Je to záloha z tohoto deníku?"); }
  e.target.value = "";
};

open().then(d => { db = d; render(); });
</script></body></html>
